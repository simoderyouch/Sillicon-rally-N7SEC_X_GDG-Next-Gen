services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sillicon_rally}
      POSTGRES_USER: ${POSTGRES_USER:-sillicon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sillicon} -d ${POSTGRES_DB:-sillicon_rally}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

