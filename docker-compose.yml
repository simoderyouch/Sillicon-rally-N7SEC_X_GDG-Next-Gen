name: sillicon-rally

services:
  frontend:
    build:
      context: ./frontend
      args:
        # The browser reaches the API through the frontend Nginx proxy.
        VITE_API_BASE_URL: ""
        VITE_LEADERBOARD_WS_URL: ""
    ports:
      # Production: expose only to OpenShip Edge on the same host.
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - public
      - application
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sillicon_rally}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sillicon}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,https://silicon-rally.edder.studio}
      OPEN_TEAM_REGISTRATION: ${OPEN_TEAM_REGISTRATION:-true}
      # Active team tokens use a sliding expiry. Set this to cover the full event.
      APP_SESSION_TOKEN_TTL: ${APP_SESSION_TOKEN_TTL:-PT24H}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sillicon-rally.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-before-an-event}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/api/v1/missions"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - application
      - data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sillicon_rally}
      POSTGRES_USER: ${POSTGRES_USER:-sillicon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sillicon} -d ${POSTGRES_DB:-sillicon_rally}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - data
      - application
    restart: unless-stopped

networks:
  public:
  application:
    internal: true
  data:
    internal: true

volumes:
  postgres_data:
  redis_data:

