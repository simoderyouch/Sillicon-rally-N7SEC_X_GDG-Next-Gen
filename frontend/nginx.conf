# In production this container is bound to 127.0.0.1, so these headers can only
# come from OpenShip Edge. Edge must replace (not append) forwarded headers.
map $http_x_forwarded_proto $edge_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_forwarded_host $edge_host {
    default $http_x_forwarded_host;
    ""      $host;
}

map $http_x_forwarded_port $edge_port {
    default $http_x_forwarded_port;
    ""      $server_port;
}

map $http_x_forwarded_for $edge_for {
    default $http_x_forwarded_for;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $edge_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $edge_for;
        proxy_set_header X-Forwarded-Host $edge_host;
        proxy_set_header X-Forwarded-Port $edge_port;
        proxy_set_header X-Forwarded-Proto $edge_proto;
    }

    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $edge_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $edge_for;
        proxy_set_header X-Forwarded-Host $edge_host;
        proxy_set_header X-Forwarded-Port $edge_port;
        proxy_set_header X-Forwarded-Proto $edge_proto;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
