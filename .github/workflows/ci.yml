name: CI

on:
  pull_request:
  push:

jobs:
  game-boundary:
    if: startsWith(github.head_ref, 'game/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce isolated game ownership
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          slug="${HEAD_REF#game/}"
          frontend_allowed="frontend/src/games/${slug}/"
          package_slug=$(printf '%s' "$slug" | tr '-' '_')
          backend_allowed="backend/src/main/java/com/silliconrally/api/games/${package_slug}/"
          backend_tests_allowed="backend/src/test/java/com/silliconrally/api/games/${package_slug}/"
          changed_files=$(git diff --name-only "$BASE_SHA" HEAD)
          for file in $changed_files; do
            case "$file" in
              "$frontend_allowed"* | "$backend_allowed"* | "$backend_tests_allowed"*) ;;
              *) echo "Game branch may modify only ${frontend_allowed}, ${backend_allowed}, and ${backend_tests_allowed}; blocked file: ${file}" >&2; exit 1 ;;
            esac
          done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: ../scripts/validate-games.sh
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn test
