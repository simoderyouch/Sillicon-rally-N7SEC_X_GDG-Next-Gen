spring:
  application:
    name: sillicon-rally-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/sillicon_rally}
    username: ${SPRING_DATASOURCE_USERNAME:sillicon}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}
  # The backend is reachable only from the frontend container. It can therefore
  # trust forwarded headers written by the loopback-bound OpenShip → Nginx chain.
  forward-headers-strategy: framework

app:
  cors:
    # Exact origins only. No wildcard origin is accepted by TrustedOrigins.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://silicon-rally.edder.studio}
  event:
    open-team-registration: ${OPEN_TEAM_REGISTRATION:true}
    team-join-code: ${APP_TEAM_JOIN_CODE:}
  admin:
    email: ${ADMIN_EMAIL:admin@sillicon-rally.local}
    password: ${ADMIN_PASSWORD:admin-gdg}
  session:
    token-ttl: ${APP_SESSION_TOKEN_TTL:PT24H}
  realtime:
    leaderboard-channel: ${APP_REALTIME_LEADERBOARD_CHANNEL:sillicon-rally:leaderboard}
